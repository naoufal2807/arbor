<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Arbor: inference gateway logo -->
  <!-- A routing tree: one input, branching to multiple backends. -->
  <!-- Primary path is thick, fallbacks are thinner. -->

  <!-- Trunk (incoming request) -->
  <path d="M240 420 L240 280" stroke="#1D9E75" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- Primary branch (thick - the chosen route) -->
  <path d="M240 280 C240 220, 150 200, 140 130" stroke="#1D9E75" stroke-width="20" stroke-linecap="round" fill="none"/>

  <!-- Secondary branch (fallback 1) -->
  <path d="M240 280 C240 230, 300 210, 320 150" stroke="#5DCAA5" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- Tertiary branch (fallback 2) -->
  <path d="M240 280 C245 245, 390 240, 405 195" stroke="#9FE1CB" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Backend nodes (leaves) -->
  <circle cx="140" cy="112" r="26" fill="#1D9E75"/>
  <circle cx="322" cy="134" r="18" fill="#5DCAA5"/>
  <circle cx="408" cy="182" r="12" fill="#9FE1CB"/>

  <!-- Request origin node -->
  <circle cx="240" cy="428" r="16" fill="#085041"/>
</svg>
